[project]
name = "parabox"
version = "0.2.0"
description = "A benchmark framework for misalignment propagation between AI agents"
readme = "README.md"
license = "MIT AND Apache-2.0"
license-files = ["LICENSE", "licenses/*.txt"]
requires-python = ">=3.12"
dependencies = ["python-dotenv>=1.0"]

[project.scripts]
parabox = "parabox.__main__:main"
parabox-benchmark = "parabox.benchmark.__main__:main"

[project.optional-dependencies]
report = ["matplotlib>=3.8"]

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = ["build>=1.2", "setuptools>=77"]

[tool.setuptools.packages.find]
include = ["parabox*"]
exclude = ["parabox.studies*", "parabox.tasks.lean*"]

[tool.setuptools.package-data]
"parabox.benchmark" = ["assets/*.json"]
"parabox.tasks.code" = ["image/**/*", "oracle/*.txt"]
