name = "parabox"
version = "0.1.0"
defaultTargets = ["Problems"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
warn.sorry = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.1"

[[lean_lib]]
name = "Problems"
globs = ["Problems.+"]
